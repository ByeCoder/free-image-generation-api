<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Frontend demo for a Cloudflare Workers AI image generation API using FLUX.1 Schnell."
  />

  <title>Cloudflare FLUX Image Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #202b50 0%,
          #0b1020 45%,
          #050811 100%
        );

      color: #f8fafc;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 70px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.05;
    }

    .subtitle {
      max-width: 700px;
      margin: 0 auto;
      color: #aebbd0;
      line-height: 1.7;
    }

    .panel {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      border: 0;
      font: inherit;
    }

    input,
    textarea,
    select {
      color: #f8fafc;
      background: #090f1d;
      border: 1px solid #273449;
      border-radius: 11px;
      padding: 13px 14px;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    button {
      padding: 14px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.2s,
        opacity 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .hint {
      margin-top: 7px;
      font-size: 0.78rem;
      color: #77859d;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.visible {
      display: block;
    }

    .status.info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.25);
      color: #bfdbfe;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fecaca;
    }

    .gallery-title {
      margin: 38px 0 18px;
      font-size: 1.25rem;
    }

    #gallery {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }

    .image-card {
      overflow: hidden;
      border-radius: 18px;
      background: #0e1628;
      border: 1px solid #25324a;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    }

    .image-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #050811;
    }

    .card-content {
      padding: 16px;
    }

    .prompt-text {
      margin: 0;
      color: #d9e2f0;
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .card-meta {
      margin-top: 9px;
      color: #718096;
      font-size: 0.77rem;
    }

    .download {
      display: block;
      margin-top: 14px;
      padding: 10px 12px;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #1d2a41;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    footer {
      margin-top: 45px;
      color: #64748b;
      text-align: center;
      font-size: 0.82rem;
    }

    code {
      color: #c4b5fd;
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 20px, 1100px);
        padding-top: 24px;
      }

      .panel {
        padding: 17px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>🎨 FLUX Image Generator</h1>

      <p class="subtitle">
        Generate AI images through your own Cloudflare Workers AI
        endpoint using FLUX.1 Schnell.
      </p>
    </header>

    <section class="panel">
      <form id="generatorForm">
        <div class="form-grid">

          <div class="full">
            <label for="apiUrl">Worker URL</label>

            <input
              id="apiUrl"
              type="url"
              value="https://free-image-generation-api.0pouyaking0.workers.dev"
              placeholder="https://your-worker.workers.dev"
              required
            />
          </div>

          <div>
            <label for="apiKey">API Key</label>

            <input
              id="apiKey"
              type="password"
              autocomplete="off"
              placeholder="Enter your API key"
              required
            />

            <div class="hint">
              The key is not stored by this page.
            </div>
          </div>

          <div>
            <label for="steps">Steps</label>

            <select id="steps">
              <option value="1">1 — Fastest</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4 — Recommended</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8 — Maximum</option>
            </select>
          </div>

          <div class="full">
            <label for="prompt">Prompt</label>

            <textarea
              id="prompt"
              maxlength="2048"
              placeholder="Example: A futuristic agricultural robot working in a greenhouse, cinematic lighting, highly detailed"
              required
            ></textarea>
          </div>

          <div class="full">
            <button id="generateButton" type="submit">
              ✨ Generate Image
            </button>
          </div>
        </div>
      </form>

      <div id="status" class="status"></div>
    </section>

    <h2 class="gallery-title">Generated Images</h2>

    <section id="gallery"></section>

    <footer>
      Powered by Cloudflare Workers AI + FLUX.1 Schnell
    </footer>
  </main>

  <script>
    const form = document.getElementById("generatorForm");
    const apiUrlInput = document.getElementById("apiUrl");
    const apiKeyInput = document.getElementById("apiKey");
    const promptInput = document.getElementById("prompt");
    const stepsInput = document.getElementById("steps");
    const button = document.getElementById("generateButton");
    const statusBox = document.getElementById("status");
    const gallery = document.getElementById("gallery");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const apiUrl = apiUrlInput.value.trim().replace(/\/+$/, "");
      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();
      const steps = Number(stepsInput.value);

      if (!apiUrl || !apiKey || !prompt) {
        showStatus(
          "Please enter the Worker URL, API key and prompt.",
          "error"
        );

        return;
      }

      setLoading(true);

      showStatus(
        `Generating image with ${steps} step${steps === 1 ? "" : "s"}...`,
        "info"
      );

      const startedAt = performance.now();

      try {
        const response = await fetch(apiUrl, {
          method: "POST",

          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            prompt,
            steps,
          }),
        });

        const contentType =
          response.headers.get("content-type") || "";

        if (!response.ok) {
          let errorMessage =
            `HTTP ${response.status} ${response.statusText}`;

          try {
            if (contentType.includes("application/json")) {
              const data = await response.json();

              errorMessage = [
                data.error,
                data.details,
              ]
                .filter(Boolean)
                .join("\n");
            } else {
              const text = await response.text();

              if (text) {
                errorMessage += `\n${text}`;
              }
            }
          } catch {
            // Keep the generic HTTP error.
          }

          throw new Error(errorMessage);
        }

        if (!contentType.startsWith("image/")) {
          const text = await response.text();

          throw new Error(
            `The server returned "${contentType}" instead of an image.\n${text}`
          );
        }

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);

        const seconds =
          ((performance.now() - startedAt) / 1000).toFixed(1);

        addImageCard(
          imageUrl,
          prompt,
          steps,
          seconds
        );

        showStatus(
          `Image generated successfully in ${seconds}s.`,
          "info"
        );
      } catch (error) {
        showStatus(
          error?.message || String(error),
          "error"
        );
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      button.disabled = isLoading;

      button.textContent = isLoading
        ? "⏳ Generating..."
        : "✨ Generate Image";
    }

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className =
        `status visible ${type}`;
    }

    function addImageCard(
      imageUrl,
      prompt,
      steps,
      seconds
    ) {
      const card = document.createElement("article");
      card.className = "image-card";

      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = prompt;

      const content = document.createElement("div");
      content.className = "card-content";

      const promptElement = document.createElement("p");
      promptElement.className = "prompt-text";
      promptElement.textContent = prompt;

      const meta = document.createElement("div");
      meta.className = "card-meta";
      meta.textContent =
        `${steps} steps • ${seconds}s`;

      const download = document.createElement("a");
      download.className = "download";
      download.href = imageUrl;
      download.download =
        `flux-image-${Date.now()}.jpg`;
      download.textContent = "⬇ Download JPEG";

      content.append(
        promptElement,
        meta,
        download
      );

      card.append(
        image,
        content
      );

      gallery.prepend(card);
    }
  </script>
</body>
</html>
